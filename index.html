<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>업무 체크리스트</title>
<style>
  :root{
    --bg:#faf5ee;
    --surface:#ffffff;
    --surface-2:#f1e7d8;
    --border:#e3d5c0;
    --text:#2a2018;
    --text-muted:#8c7a64;
    --accent:#7a4620;
    --accent-ink:#fff8ef;
    --accent-soft:#f0dfc7;
    --danger:#b23b2e;
    --danger-soft:#f7e1dc;
    --ring:#c9410b;
    --surface-3:#fffefb;
    --shadow: 0 1px 2px rgba(42,32,24,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171310; --surface:#241e17; --surface-2:#332b20; --border:#4a3d2c;
      --text:#f3e9dc; --text-muted:#a7967f; --accent:#d69a5c; --accent-ink:#1b140d;
      --accent-soft:#3a2c1b; --danger:#e2776a; --danger-soft:#3b211d; --ring:#e2776a;
      --surface-3:#3c3122;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  }
  #app{ max-width:460px; margin:0 auto; min-height:100vh; padding-bottom:40px; }
  h1,h2,h3,p{margin:0;} h1,h2{text-wrap:balance;}
  button{font-family:inherit;cursor:pointer;} input{font-family:inherit;}
  .hidden-file{display:none;}
  .screen-center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 24px;}
  .back-link{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--text-muted);font-size:12.5px;padding:0;margin-bottom:28px;}
  .brand-head{text-align:center;margin-bottom:36px;}
  .brand-head .glyph{color:var(--accent);margin-bottom:10px;}
  .brand-head h1{font-size:21px;font-weight:800;letter-spacing:-0.01em;}
  .brand-head p{font-size:12.5px;color:var(--text-muted);margin-top:6px;}
  .role-btn{width:100%;padding:18px 20px;border-radius:18px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;text-align:left;box-shadow:var(--shadow);}
  .role-btn.dark{background:var(--text);border-color:var(--text);color:var(--bg);}
  .role-btn .t1{font-weight:800;font-size:14.5px;} .role-btn .t2{font-size:12px;margin-top:3px;opacity:0.8;}
  .field{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:8px;}
  .field.err{border-color:var(--danger);}
  .field input{width:100%;border:none;outline:none;background:transparent;font-size:14.5px;color:var(--text);}
  .hint{font-size:12px;color:var(--text-muted);margin:2px 4px 22px;line-height:1.5;}
  .error-text{font-size:12px;color:var(--danger);margin:0 4px 16px;}
  .btn-cta{width:100%;padding:15px;border-radius:14px;font-size:14.5px;font-weight:800;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);}
  .btn-cta[disabled]{background:var(--surface);color:var(--text-muted);border-color:var(--border);cursor:not-allowed;}
  .btn-dark-cta{width:100%;padding:15px;border-radius:14px;font-size:14.5px;font-weight:800;background:var(--text);color:var(--bg);border:2px solid var(--text);}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 10px;}
  .topbar .date{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;}
  .topbar h1{font-size:18px;font-weight:800;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .link-btn{background:none;border:none;font-size:12px;color:var(--text-muted);text-decoration:underline;padding:0;}
  .live-dot{width:7px;height:7px;border-radius:999px;background:var(--accent);display:inline-block;box-shadow:0 0 0 0 var(--accent);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(122,70,32,0.45);}70%{box-shadow:0 0 0 5px rgba(122,70,32,0);}100%{box-shadow:0 0 0 0 rgba(122,70,32,0);}}
  .segmented{margin:16px 20px;background:var(--surface-2);border-radius:999px;padding:4px;display:flex;gap:2px;}
  .segmented button{flex:1;padding:9px;border:none;border-radius:999px;background:transparent;font-size:13.5px;font-weight:700;color:var(--text-muted);}
  .segmented button.on{background:var(--text);color:var(--bg);}
  .px{padding-left:20px;padding-right:20px;}
  .shift-row{display:flex;gap:8px;margin-bottom:16px;}
  .shift-btn{flex:1;padding:11px;border-radius:14px;font-size:13.5px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);}
  .shift-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .progress-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .progress-row span{font-size:12px;color:var(--text-muted);}
  .progress-track{width:112px;height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .2s;}
  .item-row{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:9px;display:flex;align-items:flex-start;gap:11px;}
  .item-row.done{border-color:var(--accent-soft);background:var(--accent-soft);}
  .check-box{margin-top:2px;flex:none;width:21px;height:21px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--accent-ink);}
  .check-box.on{background:var(--accent);border-color:var(--accent);}
  .item-body{flex:1;min-width:0;}
  .item-label-row{display:flex;align-items:center;gap:6px;}
  .item-label-row span{font-size:13.5px;line-height:1.4;}
  .req-icon{color:var(--danger);flex:none;}
  .req-text{font-size:11.5px;color:var(--danger);margin-top:4px;}
  .photo-block{margin-top:8px;display:flex;align-items:center;gap:9px;}
  .photo-block img{height:60px;width:60px;object-fit:cover;border-radius:10px;border:1px solid var(--border);}
  .photo-meta{font-size:11px;color:var(--text-muted);}
  .photo-meta button{display:block;margin-top:3px;color:var(--danger);background:none;border:none;padding:0;font-size:11px;text-decoration:underline;}
  .item-actions{flex:none;}
  .icon-btn{width:32px;height:32px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);}
  .submit-note{font-size:11.5px;text-align:center;color:var(--text-muted);margin-top:9px;}
  .status-banner{width:100%;padding:14px;border-radius:14px;font-size:13.5px;font-weight:800;text-align:center;}
  .status-banner.pending{background:var(--surface-2);color:var(--text-muted);}
  .status-banner.approve{background:var(--accent-soft);color:var(--accent);}
  .status-banner.reject{background:var(--danger-soft);color:var(--danger);}
  .status-banner .note{display:block;font-weight:400;font-size:12px;margin-top:6px;}
  .empty{text-align:center;padding:64px 20px;color:var(--text-muted);}
  .empty .glyph{color:var(--border);margin-bottom:8px;} .empty p{font-size:13.5px;} .empty p.sub{font-size:12px;margin-top:4px;}
  .sub-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:9px;}
  .sub-card-top{display:flex;align-items:center;justify-content:space-between;}
  .sub-card .name{font-size:13.5px;font-weight:700;} .sub-card .meta{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
  .badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;flex:none;white-space:nowrap;}
  .badge-pending{background:var(--surface-2);color:var(--text-muted);}
  .badge-approved{background:var(--accent-soft);color:var(--accent);}
  .badge-rejected{background:var(--danger-soft);color:var(--danger);}
  .reject-note{font-size:11.5px;color:var(--danger);margin-top:8px;background:var(--danger-soft);border-radius:10px;padding:8px 10px;}
  .lock-glyph{color:var(--text);}
  .mgr-tabs{display:flex;gap:6px;overflow-x:auto;padding:0 20px 8px;margin-bottom:6px;}
  .mgr-tabs::-webkit-scrollbar{display:none;}
  .mgr-tab{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);white-space:nowrap;}
  .mgr-tab.on{background:var(--text);color:var(--bg);border-color:var(--text);}
  .tab-desc{font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.5;}
  .add-row{display:flex;gap:8px;margin-bottom:4px;}
  .add-row input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:11px 13px;font-size:13.5px;color:var(--text);outline:none;}
  .add-row .add-btn{width:40px;height:40px;border-radius:14px;background:var(--text);color:var(--bg);border:none;display:flex;align-items:center;justify-content:center;flex:none;}
  .target-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
  .target-card .name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .tag-off{font-size:10.5px;font-weight:600;color:var(--text-muted);background:var(--surface-2);padding:2px 7px;border-radius:999px;}
  .target-card .meta{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
  .trash-btn{background:none;border:none;color:var(--text-muted);padding:4px;}
  .chip-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;}
  .chip{flex:none;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .chip.on.neutral{background:var(--text);color:var(--bg);border-color:var(--text);}
  .item-edit-row{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .item-edit-row .lbl{flex:1;font-size:13.5px;}
  .req-toggle{font-size:10.5px;font-weight:800;padding:5px 8px;border-radius:999px;display:flex;align-items:center;gap:4px;flex:none;border:none;}
  .req-toggle.on{background:var(--danger-soft);color:var(--danger);} .req-toggle.off{background:var(--surface-2);color:var(--text-muted);}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-nav button{background:none;border:none;color:var(--text-muted);font-size:18px;padding:2px 10px;} .cal-nav p{font-size:14px;font-weight:800;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--text-muted);font-weight:700;padding:4px 0;}
  .cal-day{aspect-ratio:1;border-radius:10px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);}
  .cal-day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .cal-day.today{box-shadow:0 0 0 2px var(--ring);}
  .cal-day.saving{opacity:0.6;}
  .cal-day .spin{animation:spin 0.8s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .cal-note{font-size:11.5px;color:var(--text-muted);margin-top:12px;}
  .cal-note.saved{color:var(--accent);font-weight:700;display:flex;align-items:center;gap:5px;}
  .due-card{background:var(--surface);border:2px solid var(--danger);border-radius:14px;padding:14px 15px;margin-bottom:10px;}
  .due-card .name{font-size:13.5px;font-weight:700;} .due-card .meta{font-size:11.5px;color:var(--text-muted);margin:4px 0 12px;}
  .due-actions{display:flex;gap:8px;} .due-actions button{flex:1;padding:10px;border-radius:10px;font-size:12px;font-weight:800;border:none;}
  .btn-release{background:var(--accent);color:var(--accent-ink);} .btn-extend{background:var(--text);color:var(--bg);}
  .upcoming-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 15px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;}
  .upcoming-card .name{font-size:13.5px;font-weight:700;} .upcoming-card .meta{font-size:11.5px;color:var(--text-muted);}
  .section-label{font-size:11.5px;font-weight:800;color:var(--text-muted);margin-bottom:8px;letter-spacing:.02em;}
  .section-label.warn{color:var(--danger);}
  .review-row{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 15px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;}
  .review-row .name{font-size:13px;font-weight:700;} .review-row .meta{font-size:11px;color:var(--text-muted);}
  .decision-badge{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;}
  .decision-release{background:var(--accent-soft);color:var(--accent);} .decision-continue{background:var(--danger-soft);color:var(--danger);}
  .date-group{margin-bottom:16px;} .date-group .date-h{font-size:11.5px;font-weight:800;color:var(--text-muted);margin-bottom:6px;}
  .arch-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;overflow:hidden;}
  .arch-top{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 15px;background:none;border:none;text-align:left;color:var(--text);}
  .arch-top .left{display:flex;align-items:center;gap:8px;} .arch-top .staff{font-size:13.5px;font-weight:700;} .arch-top .shift{font-size:11.5px;color:var(--text-muted);}
  .arch-top .right{display:flex;align-items:center;gap:7px;color:var(--danger);}
  .arch-detail{padding:12px 15px 14px;border-top:1px solid var(--border);}
  .accordion-body{padding:11px 15px 14px;border-top:1px solid var(--border);}
  .chk-summary{display:flex;gap:6px;margin-bottom:10px;}
  .chk-summary span{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;}
  .chk-summary .cnt-done{background:var(--accent-soft);color:var(--accent);}
  .chk-summary .cnt-miss{background:var(--danger-soft);color:var(--danger);}
  .chk-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;margin-bottom:7px;background:var(--surface-2);border-left:3px solid var(--border);}
  .chk-item:last-child{margin-bottom:0;}
  .chk-item.done{border-left-color:var(--accent);}
  .chk-item.miss{border-left-color:var(--danger);background:var(--danger-soft);}
  .chk-item .stat{width:22px;height:22px;border-radius:999px;flex:none;display:flex;align-items:center;justify-content:center;}
  .chk-item.done .stat{background:var(--accent);color:var(--accent-ink);}
  .chk-item.miss .stat{background:var(--danger);color:#fff;}
  .chk-item .body{flex:1;min-width:0;}
  .chk-item .lbl{font-size:12.5px;font-weight:600;line-height:1.4;}
  .chk-item .sub{font-size:10.5px;color:var(--text-muted);margin-top:3px;display:flex;align-items:center;gap:4px;}
  .chk-item .sub.warn{color:var(--danger);font-weight:700;}
  .chk-item .thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--border);}
  .note-input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--text);outline:none;margin-top:2px;}
  .decide-row{display:flex;gap:8px;margin-top:10px;} .decide-row button{flex:1;padding:10px;border-radius:10px;font-size:12px;font-weight:800;border:none;}
  .btn-reject{background:var(--danger);color:#fff;} .btn-approve{background:var(--accent);color:var(--accent-ink);}
  .backup-row{margin:0 0 16px;} .backup-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;border-radius:12px;font-size:12.5px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);}
  .setup-wrap{max-width:520px;margin:0 auto;padding:40px 24px;}
  .setup-wrap h1{font-size:18px;font-weight:800;margin-bottom:10px;}
  .setup-wrap p{font-size:13px;color:var(--text-muted);line-height:1.7;margin-bottom:10px;}
  .setup-wrap code{background:var(--surface-2);padding:2px 6px;border-radius:6px;font-size:12.5px;}
  .setup-wrap ol{font-size:13px;color:var(--text);line-height:1.9;padding-left:20px;}
</style>
</head>

  /* ---------- helpers ---------- */
  function pad(n){ return String(n).padStart(2,"0"); }
  function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function nowTime(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
  function fmtDate(s){
    if(!s) return "";
    var p=s.split("-").map(Number), y=p[0],m=p[1],d=p[2];
    var wd = DOW[new Date(y,m-1,d).getDay()];
    return m+"."+d+" ("+wd+")";
  }
  function daysBetween(a,b){
    var pa=a.split("-").map(Number), pb=b.split("-").map(Number);
    var da=new Date(pa[0],pa[1]-1,pa[2]), db2=new Date(pb[0],pb[1]-1,pb[2]);
    return Math.floor((db2-da)/86400000);
  }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function docIdFor(name){ return String(name).replace(/[\/\s]+/g,"_"); }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve,reject){
      var reader = new FileReader();
      reader.onload = function(){
        var img = new Image();
        img.onload = function(){
          var w=img.width, h=img.height;
          if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
          else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
          var canvas = document.createElement("canvas");
          canvas.width=w; canvas.height=h;
          canvas.getContext("2d").drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

      star:'<polygon points="12 2.5 14.9 8.6 21.5 9.4 16.7 13.9 18 20.5 12 17.2 6 20.5 7.3 13.9 2.5 9.4 9.1 8.6"/>',

  /* ---------- local (per-device) identity ---------- */
  function loadMe(){ try{ return localStorage.getItem("ccl_me")||null; }catch(e){ return null; } }
  function saveMe(n){ try{ localStorage.setItem("ccl_me", n); }catch(e){} }
  function clearMe(){ try{ localStorage.removeItem("ccl_me"); }catch(e){} }

  function itemsFor(staffName){ return state.data.items[staffName] || DEFAULT_ITEMS; }

  function submissionDocId(name, shift, date){ return docIdFor(name)+"__"+date+"__"+shift; }
  function todaySubmissionFor(name, shift){
    var id = submissionDocId(name, shift, todayISO());
    return state.data.submissions.find(function(s){ return s.id===id; }) || null;
  }
  function submissionItemsArray(s){
    var map = s.items || {};
    var order = s.order || [];
    var seen = {};
    var arr = order.map(function(id){ seen[id]=true; return map[id]; }).filter(Boolean);
    Object.keys(map).forEach(function(id){ if(!seen[id]) arr.push(map[id]); });
    return arr;
  }

  /* ---------- state ---------- */
  var state = {
    role: null,
    data: { targets:[], items:{}, submissions:[], reviews:[], calendars:{} },
    ready: false,
    me: loadMe(),

    staffTab: "today", shift: "open",

    managerAuthed: false, managerPwError: false, managerTab: "inbox",

    inboxOpenId: null, targetsError: "",
    itemsSelected: null, itemsShift: "open",
    calSelected: null,
    calCursor: (function(){ var d=new Date(); return { y:d.getFullYear(), m:d.getMonth() }; })(),
    calSavingIso: null, calSavedIso: null, calSavedAt: null,
    archiveFilter: "all", archiveOpenId: null
  };

  /* ---------- firestore listeners (real-time sync) ---------- */
  var readyFlags = { targets:false, items:false, submissions:false, reviews:false, calendars:false };
  function markReady(k){ readyFlags[k]=true; if(Object.values(readyFlags).every(Boolean)){ state.ready = true; } render(); }

  db.collection("targets").onSnapshot(function(snap){
    state.data.targets = snap.docs.map(function(d){ return d.data(); });
    markReady("targets");
  }, function(err){ showConnError(err); });

  db.collection("items").onSnapshot(function(snap){
    var obj = {};
    snap.forEach(function(d){ obj[d.id] = d.data(); });
    state.data.items = obj;
    markReady("items");
  }, function(err){ showConnError(err); });

  db.collection("submissions").onSnapshot(function(snap){
    var arr = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
    arr.sort(function(a,b){ return (b.date+b.time) > (a.date+a.time) ? 1 : -1; });
    state.data.submissions = arr;
    markReady("submissions");
  }, function(err){ showConnError(err); });

  db.collection("reviews").onSnapshot(function(snap){
    var arr = snap.docs.map(function(d){ return d.data(); });
    arr.sort(function(a,b){ return b.decidedAt > a.decidedAt ? 1 : -1; });
    state.data.reviews = arr;
    markReady("reviews");
  }, function(err){ showConnError(err); });

  db.collection("calendars").onSnapshot(function(snap){
    var obj = {};
    snap.forEach(function(d){ obj[d.id] = (d.data()||{}).marks || {}; });
    state.data.calendars = obj;
    markReady("calendars");
  }, function(err){ showConnError(err); });

  var connError = null;
  function showConnError(err){
    connError = (err && err.message) ? err.message : "연결에 실패했어요";
    render();
  }

  /* ---------- render root ---------- */
  function render(){
    document.getElementById("app").innerHTML = screenHTML();
  }

      return '<div class="setup-wrap"><h1>연결에 문제가 있어요</h1><p>'+escapeHtml(connError)+'</p>' +

    }
    if(!state.ready){
      return '<div class="screen-center"><div class="brand-head"><div class="glyph">'+icon("clipboardCheck",30)+'</div><p>불러오는 중…</p></div></div>';
    }
    if(!state.role) return roleGateHTML();
    if(state.role==="staff") return staffAppHTML();
    return managerAppHTML();
  }

    var target = state.data.targets.find(function(t){ return t.name===name && t.active; });
    var items = itemsFor(name);
    var currentItems = items[state.shift] || [];
    var sub = todaySubmissionFor(name, state.shift);

    var doneCount = currentItems.filter(function(it){ return subItems[it.id] && subItems[it.id].done; }).length;
    var allDone = currentItems.length>0 && doneCount===currentItems.length;

    html += '<div class="segmented">';
    html += '<button data-action="staffTab" data-tab="today" class="'+(state.staffTab==="today"?"on":"")+'">오늘 체크리스트</button>';
    html += '<button data-action="staffTab" data-tab="history" class="'+(state.staffTab==="history"?"on":"")+'">내 기록</button>';

      } else {

        html += '</div>';
        html += '<div class="progress-row"><span>'+doneCount+' / '+currentItems.length+' 완료</span><div class="progress-track"><div class="progress-fill" style="width:'+(currentItems.length? (doneCount/currentItems.length*100):0)+'%"></div></div></div>';
        html += '<div>';
        currentItems.forEach(function(it){
          var si = subItems[it.id] || {};
          var checked = !!si.done;
          var photo = si.photo;
          html += '<div class="item-row '+(checked?"done":"")+'">';
          html += '<button class="check-box '+(checked?"on":"")+'" data-action="toggleItem" data-id="'+it.id+'">'+(checked?icon("check",13):"")+'</button>';
          html += '<div class="item-body"><div class="item-label-row"><span>'+escapeHtml(it.label)+'</span>'+(it.photoRequired?icon("camera",11,"req-icon"):"")+'</div>';
          if(photo){
            html += '<div class="photo-block"><img src="'+photo+'" alt="" /><div class="photo-meta">촬영 '+(si.photoTime||"")+'<button data-action="removePhoto" data-id="'+it.id+'">삭제</button></div></div>';
          } else if(it.photoRequired){
            html += '<p class="req-text">사진 촬영 필수 항목</p>';
          }
          html += '</div>';
          html += '<div class="item-actions"><button type="button" class="icon-btn" data-action="openCamera" data-id="'+it.id+'">'+icon("camera",15)+'</button>';
          html += '<input type="file" accept="image/*" capture="environment" class="hidden-file" data-photo-input="'+it.id+'" /></div>';
          html += '</div>';
        });
        html += '</div>';
        if(sub && sub.status==="rejected"){
          html += '<div class="status-banner reject">반려됨 · 다시 체크해주세요' + (sub.reviewNote? '<span class="note">사유: '+escapeHtml(sub.reviewNote)+'</span>':'') + '</div>';
        } else if(sub && sub.status==="approved"){
          html += '<div class="status-banner approve">승인 완료 ✓</div>';

          html += '<div class="status-banner pending">모든 항목 완료 · 매니저 확인 대기중</div>';
        } else {
          html += '<p class="submit-note">체크하거나 사진을 찍으면 그 즉시 저장돼요. 하나씩 완료해나가시면 돼요.</p>';

  function statusBadge(status){
    var map = { pending:["확인 대기","badge-pending"], approved:["승인","badge-approved"], rejected:["반려","badge-rejected"] };

    items.forEach(function(it){
      var ok = !!it.done;
      html += '<div class="chk-item '+(ok?"done":"miss")+'">';
      html += '<div class="stat">'+icon(ok?"check":"x",11)+'</div>';

        html += '<div class="accordion-body">';
        html += checklistItemsHTML(sArr);
        html += '<input type="text" class="note-input" id="rejectNote_'+s.id+'" placeholder="반려 시 사유 (선택)" />';
        html += '<div class="decide-row"><button type="button" class="btn-reject" data-action="decide" data-id="'+s.id+'" data-status="rejected">반려</button>';
        html += '<button type="button" class="btn-approve" data-action="decide" data-id="'+s.id+'" data-status="approved">승인</button></div>';
        html += '</div>';
      }
      html += '</div>';
    });
    return html;
  }

  function targetsTabHTML(){
    var html = '<p class="tab-desc">체크리스트를 수행해야 하는 스텝을 지정하세요. 지정일부터 2주 주기가 시작돼요.</p>';
    html += '<div class="add-row"><input id="newTargetName" placeholder="스텝 이름 (풀네임)" /><button type="button" class="add-btn" data-action="addTarget">'+icon("plus",16)+'</button></div>';
    html += state.targetsError ? '<p class="error-text">'+escapeHtml(state.targetsError)+'</p>' : '<div style="margin-bottom:16px;"></div>';
    if(state.data.targets.length===0){
      html += '<p style="text-align:center;color:var(--text-muted);font-size:13.5px;padding:32px 0;">지정된 대상자가 없어요</p>';
    } else {
      state.data.targets.forEach(function(t){
        html += '<div class="target-card"><div><p class="name">'+escapeHtml(t.name)+(!t.active?'<span class="tag-off">해제됨</span>':'')+'</p>';
        html += '<p class="meta">지정일 '+fmtDate(t.startDate)+' · '+(t.active?(daysBetween(t.startDate,todayISO())+"일째"):"종료")+'</p></div>';
        html += '<button type="button" class="trash-btn" data-action="removeTarget" data-name="'+escapeHtml(t.name)+'">'+icon("trash",15)+'</button></div>';
      });
    }
    return html;
  }

  function itemsTabHTML(){
    var targets = state.data.targets;
    if(targets.length===0) return '<p style="text-align:center;color:var(--text-muted);font-size:13.5px;padding:32px 0;">먼저 대상자 탭에서 스텝을 지정해주세요</p>';
    if(!state.itemsSelected || !targets.some(function(t){return t.name===state.itemsSelected;})) state.itemsSelected = targets[0].name;
    var selected = state.itemsSelected;
    var items = itemsFor(selected);
    var shift = state.itemsShift;

    var html = '<div class="chip-row">';
    targets.forEach(function(t){
      html += '<button type="button" class="chip '+(selected===t.name?"on":"")+'" data-action="selectItemsStaff" data-name="'+escapeHtml(t.name)+'">'+escapeHtml(t.name)+'</button>';
    });
    html += '</div>';

    html += '<div class="shift-row">';
    html += '<button class="shift-btn '+(shift==="open"?"on":"")+'" data-action="setItemsShift" data-shift="open">오픈 항목</button>';
    html += '<button class="shift-btn '+(shift==="close"?"on":"")+'" data-action="setItemsShift" data-shift="close">마감 항목</button>';
    html += '</div>';

    (items[shift]||[]).forEach(function(it){
      html += '<div class="item-edit-row"><span class="lbl">'+escapeHtml(it.label)+'</span>';
      html += '<button type="button" class="req-toggle '+(it.photoRequired?"on":"off")+'" data-action="togglePhotoReq" data-id="'+it.id+'">'+icon("camera",10)+' '+(it.photoRequired?"사진 필수":"사진 선택")+'</button>';
      html += '<button type="button" class="trash-btn" data-action="removeChecklistItem" data-id="'+it.id+'">'+icon("trash",14)+'</button></div>';
    });

    html += '<div class="add-row"><input id="newItemLabel" placeholder="새 항목 추가" /><button type="button" class="add-btn" data-action="addChecklistItem">'+icon("plus",15)+'</button></div>';
    return html;
  }

  function calendarTabHTML(){
    var targets = state.data.targets;
    if(targets.length===0) return '<p style="text-align:center;color:var(--text-muted);font-size:13.5px;padding:32px 0;">먼저 대상자 탭에서 스텝을 지정해주세요</p>';
    if(!state.calSelected || !targets.some(function(t){return t.name===state.calSelected;})) state.calSelected = targets[0].name;
    var selected = state.calSelected;
    var marks = state.data.calendars[selected] || {};

    var html = '<div class="chip-row">';
    targets.forEach(function(t){
      html += '<button type="button" class="chip '+(selected===t.name?"on":"")+'" data-action="selectCalStaff" data-name="'+escapeHtml(t.name)+'">'+escapeHtml(t.name)+'</button>';
    });
    html += '</div>';

    var y = state.calCursor.y, m = state.calCursor.m;
    html += '<div class="cal-nav"><button type="button" data-action="calPrev">‹</button><p>'+y+'년 '+(m+1)+'월</p><button type="button" data-action="calNext">›</button></div>';
    html += '<div class="cal-grid">';
    DOW.forEach(function(d){ html += '<div class="cal-dow">'+d+'</div>'; });
    var first = new Date(y,m,1), startDow = first.getDay(), daysInMonth = new Date(y,m+1,0).getDate();
    for(var i=0;i<startDow;i++) html += '<div></div>';
    for(var d=1; d<=daysInMonth; d++){
      var iso = y+"-"+pad(m+1)+"-"+pad(d);
      var on = !!marks[iso];
      var isToday = iso===todayISO();
      var saving = state.calSavingIso===iso;
      html += '<button type="button" class="cal-day '+(on?"on":"")+' '+(isToday?"today":"")+' '+(saving?"saving":"")+'" data-action="toggleCalDay" data-iso="'+iso+'">'+(saving?icon("rotateCcw",11,"spin"):d)+'</button>';
    }
    html += '</div>';
    if(state.calSavedIso && state.calSavedAt){
      html += '<p class="cal-note saved">'+icon("check",11)+' '+state.calSavedIso.split("-").slice(1).join(".")+'일 저장됨 · '+state.calSavedAt+'</p>';
    } else {
      html += '<p class="cal-note">날짜를 눌러 '+escapeHtml(selected)+'의 근무일을 표시하세요 (진한 색 = 근무) · 누르면 바로 저장돼요</p>';
    }
    return html;
  }

  function reviewTabHTML(){
    var targets = state.data.targets;
    var due = targets.filter(function(t){ return t.active && daysBetween(t.startDate, todayISO())>=14; });
    var upcoming = targets.filter(function(t){ return t.active && daysBetween(t.startDate, todayISO())<14; });
    var reviews = state.data.reviews;

    var html = '';
    if(due.length>0){
      html += '<div class="section-label warn">검토 필요</div>';
      due.forEach(function(t){
        html += '<div class="due-card"><p class="name">'+escapeHtml(t.name)+'</p>';
        html += '<p class="meta">'+fmtDate(t.startDate)+' 시작 · '+daysBetween(t.startDate,todayISO())+'일 경과 · 2주 경과됨</p>';
        html += '<div class="due-actions"><button type="button" class="btn-release" data-action="reviewDecide" data-name="'+escapeHtml(t.name)+'" data-decision="release">개선됨 · 해제</button>';
        html += '<button type="button" class="btn-extend" data-action="reviewDecide" data-name="'+escapeHtml(t.name)+'" data-decision="continue">2주 연장</button></div></div>';
      });
    }
    if(upcoming.length>0){
      html += '<div class="section-label" style="margin-top:'+(due.length>0?"20px":"0")+'">진행 중</div>';
      upcoming.forEach(function(t){
        html += '<div class="upcoming-card"><p class="name">'+escapeHtml(t.name)+'</p><p class="meta">'+(14-daysBetween(t.startDate,todayISO()))+'일 후 검토</p></div>';
      });
    }
    html += '<div style="margin-top:20px;"><div class="section-label">검토 기록</div>';
    if(reviews.length===0){
      html += '<p style="text-align:center;color:var(--text-muted);font-size:13px;padding:20px 0;">아직 검토 기록이 없어요</p>';
    } else {
      reviews.forEach(function(r){
        html += '<div class="review-row"><div><p class="name">'+escapeHtml(r.staff)+'</p><p class="meta">'+r.decidedAt+'</p></div>';
        html += '<span class="decision-badge '+(r.decision==="release"?"decision-release":"decision-continue")+'">'+(r.decision==="release"?"개선 · 해제":"2주 연장")+'</span></div>';
      });
    }
    html += '</div>';
    return html;
  }

  function archiveTabHTML(){
    var subs = state.data.submissions;
    var staffNames = Array.from(new Set(subs.map(function(s){return s.staff;})));
    var filter = state.archiveFilter;
    var filtered = filter==="all" ? subs : subs.filter(function(s){return s.staff===filter;});
    var byDate = {};
    filtered.forEach(function(s){ (byDate[s.date] = byDate[s.date]||[]).push(s); });
    var dates = Object.keys(byDate).sort().reverse();

    var html = '<div class="backup-row"><button type="button" class="backup-btn" data-action="downloadBackup">'+icon("download",13)+' 전체 데이터 백업 다운로드</button></div>';

    html += '<div class="chip-row">';
    html += '<button type="button" class="chip neutral '+(filter==="all"?"on":"")+'" data-action="setArchiveFilter" data-name="all">전체</button>';
    staffNames.forEach(function(n){
      html += '<button type="button" class="chip neutral '+(filter===n?"on":"")+'" data-action="setArchiveFilter" data-name="'+escapeHtml(n)+'">'+escapeHtml(n)+'</button>';
    });
    html += '</div>';

    if(dates.length===0){
      html += '<p style="text-align:center;color:var(--text-muted);font-size:13.5px;padding:36px 0;">기록이 없어요</p>';
      return html;
    }
    dates.forEach(function(date){
      html += '<div class="date-group"><div class="date-h">'+fmtDate(date)+'</div>';
      byDate[date].forEach(function(s){
        var isOpen = state.archiveOpenId===s.id;
        var sArr = submissionItemsArray(s);
        var missed = sArr.filter(function(i){return !i.done;});
        html += '<div class="arch-card"><button type="button" class="arch-top" data-action="toggleArchive" data-id="'+s.id+'">';
        html += '<div class="left"><span class="staff">'+escapeHtml(s.staff)+'</span><span class="shift">'+(s.shift==="open"?"오픈":"마감")+'</span></div>';
        html += '<div class="right">'+(missed.length>0?icon("alertCircle",12):"")+statusBadge(s.status)+'</div></button>';
        if(isOpen){
          html += '<div class="arch-detail">';
          html += checklistItemsHTML(sArr);
          if(s.reviewNote){ html += '<p class="reject-note">반려 사유: '+escapeHtml(s.reviewNote)+'</p>'; }
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    });
    return html;
  }

  /* ---------- mutations (write to Firestore; UI updates via onSnapshot) ---------- */
  function addTarget(name){
    var ref = db.collection("targets").doc(docIdFor(name));
    ref.set({ name:name, startDate: todayISO(), active:true });
    db.collection("items").doc(docIdFor(name)).get().then(function(snap){
      if(!snap.exists) db.collection("items").doc(docIdFor(name)).set(clone(DEFAULT_ITEMS));
    });
    db.collection("calendars").doc(docIdFor(name)).set({ marks:{} }, { merge:true });
  }
  function removeTarget(name){ db.collection("targets").doc(docIdFor(name)).delete(); }
  function saveItems(name, itemsObj){ db.collection("items").doc(docIdFor(name)).set(itemsObj); }
  function decideSubmission(id, status, note){
    db.collection("submissions").doc(id).update({
      status: status, reviewNote: status==="rejected" ? note : "", reviewedAt: todayISO()+" "+nowTime()
    });
  }
  function addReview(name, decision, target){
    db.collection("reviews").add({ staff:name, cycleStart: target?target.startDate:todayISO(), decidedAt: todayISO()+" "+nowTime(), decision: decision });
    var upd = decision==="continue" ? { startDate: todayISO() } : { active:false };
    db.collection("targets").doc(docIdFor(name)).update(upd);
  }
  function toggleCalDay(name, iso, newVal){
    var fieldPath = "marks."+iso;
    var upd = {}; upd[fieldPath] = newVal;
    return db.collection("calendars").doc(docIdFor(name)).update(upd).catch(function(){
      var setObj = { marks:{} }; setObj.marks[iso]=newVal;
      return db.collection("calendars").doc(docIdFor(name)).set(setObj, { merge:true });
    });
  }
  function updateSubmissionItem(name, shift, itemDef, patch){
    var id = submissionDocId(name, shift, todayISO());
    var ref = db.collection("submissions").doc(id);
    var itemVal = Object.assign({ label:itemDef.label, photoRequired:itemDef.photoRequired, done:false, photo:null, photoTime:null }, patch);
    var upd = { status:"pending", reviewNote:"", time: nowTime() };
    upd["items."+itemDef.id] = itemVal;
    ref.update(upd).catch(function(){
      var defs = itemsFor(name)[shift] || [];
      var initItems = {};
      defs.forEach(function(d){
        initItems[d.id] = { label:d.label, photoRequired:d.photoRequired, done:false, photo:null, photoTime:null };
      });
      initItems[itemDef.id] = itemVal;
      var order = defs.map(function(x){ return x.id; });
      ref.set({
        staff:name, shift:shift, date: todayISO(), time: nowTime(),
        status:"pending", reviewNote:"", order: order, items: initItems
      }, { merge:true });
    });
  }

  function downloadBackup(){
    var payload = JSON.stringify(state.data, null, 2);
    var blob = new Blob([payload], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "checklist_backup_"+todayISO()+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- event handling ---------- */
  var root = document.getElementById("app");

  root.addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if(!btn) return;
    var action = btn.getAttribute("data-action");

    if(action==="pickRole"){ state.role = btn.getAttribute("data-role"); render(); }
    else if(action==="exitToGate"){ state.role = null; state.managerAuthed = false; render(); }
    else if(action==="staffLogin"){
      var v = document.getElementById("nameInput").value.trim();
      if(!v) return;
      saveMe(v); state.me = v; render();
    }
    else if(action==="switchName"){ clearMe(); state.me = null; render(); }
    else if(action==="staffTab"){ state.staffTab = btn.getAttribute("data-tab"); render(); }
    else if(action==="setShift"){ state.shift = btn.getAttribute("data-shift"); render(); }
    else if(action==="toggleItem"){
      var id = btn.getAttribute("data-id");
      var items = itemsFor(state.me)[state.shift];
      var it = items.find(function(x){return x.id===id;});
      if(!it) return;
      var sub0 = todaySubmissionFor(state.me, state.shift);
      var cur0 = sub0 && sub0.items && sub0.items[id];
      if(it.photoRequired && !(cur0 && cur0.photo)){
        var inp = root.querySelector('[data-photo-input="'+id+'"]');
        if(inp) inp.click();
        return;
      }
      updateSubmissionItem(state.me, state.shift, it, { done: !(cur0 && cur0.done) });
    }
    else if(action==="openCamera"){
      var id2 = btn.getAttribute("data-id");
      var inp2 = root.querySelector('[data-photo-input="'+id2+'"]');
      if(inp2) inp2.click();
    }
    else if(action==="removePhoto"){
      var id3 = btn.getAttribute("data-id");
      var items3 = itemsFor(state.me)[state.shift];
      var it3 = items3.find(function(x){return x.id===id3;});
      if(it3) updateSubmissionItem(state.me, state.shift, it3, { done:false, photo:null, photoTime:null });
    }
    else if(action==="managerLogin"){
      var pw = document.getElementById("pwInput").value;
      if(pw===MANAGER_PW){ state.managerAuthed = true; state.managerPwError = false; }
      else { state.managerPwError = true; }
      render();
    }
    else if(action==="mgrTab"){ state.managerTab = btn.getAttribute("data-tab"); render(); }
    else if(action==="toggleInbox"){ var iid=btn.getAttribute("data-id"); state.inboxOpenId = state.inboxOpenId===iid?null:iid; render(); }
    else if(action==="decide"){
      var sid = btn.getAttribute("data-id"), status = btn.getAttribute("data-status");
      var noteEl = document.getElementById("rejectNote_"+sid);
      var note = noteEl ? noteEl.value : "";
      decideSubmission(sid, status, note);
      state.inboxOpenId = null;
      render();
    }
    else if(action==="addTarget"){
      var elN = document.getElementById("newTargetName");
      var n = elN.value.trim();
      state.targetsError = "";
      if(!n) return;
      if(state.data.targets.some(function(t){return t.name===n;})){ state.targetsError = "이미 지정된 이름이에요."; render(); return; }
      addTarget(n);
      elN.value = "";
      render();
    }
    else if(action==="removeTarget"){ removeTarget(btn.getAttribute("data-name")); }
    else if(action==="selectItemsStaff"){ state.itemsSelected = btn.getAttribute("data-name"); render(); }
    else if(action==="setItemsShift"){ state.itemsShift = btn.getAttribute("data-shift"); render(); }
    else if(action==="togglePhotoReq"){
      var pid = btn.getAttribute("data-id");
      var itms = clone(itemsFor(state.itemsSelected));
      itms[state.itemsShift] = itms[state.itemsShift].map(function(x){ return x.id===pid ? Object.assign({},x,{photoRequired:!x.photoRequired}) : x; });
      saveItems(state.itemsSelected, itms);
    }
    else if(action==="removeChecklistItem"){
      var rid = btn.getAttribute("data-id");
      var itms2 = clone(itemsFor(state.itemsSelected));
      itms2[state.itemsShift] = itms2[state.itemsShift].filter(function(x){return x.id!==rid;});
      saveItems(state.itemsSelected, itms2);
    }
    else if(action==="addChecklistItem"){
      var labelEl = document.getElementById("newItemLabel");
      var label = labelEl.value.trim();
      if(!label) return;
      var itms3 = clone(itemsFor(state.itemsSelected));
      itms3[state.itemsShift] = itms3[state.itemsShift].concat([{ id:"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), label:label, photoRequired:true }]);
      saveItems(state.itemsSelected, itms3);
      labelEl.value = "";
    }
    else if(action==="selectCalStaff"){ state.calSelected = btn.getAttribute("data-name"); render(); }
    else if(action==="calPrev"){ var c=state.calCursor; state.calCursor = c.m===0 ? {y:c.y-1,m:11} : {y:c.y,m:c.m-1}; render(); }
    else if(action==="calNext"){ var c2=state.calCursor; state.calCursor = c2.m===11 ? {y:c2.y+1,m:0} : {y:c2.y,m:c2.m+1}; render(); }
    else if(action==="toggleCalDay"){
      var iso = btn.getAttribute("data-iso");
      var cur = state.data.calendars[state.calSelected] || {};
      var calName = state.calSelected;
      state.calSavingIso = iso; state.calSavedIso = null; render();
      toggleCalDay(calName, iso, !cur[iso]).then(function(){
        state.calSavingIso = null;
        state.calSavedIso = iso; state.calSavedAt = nowTime();
        render();
        setTimeout(function(){
          if(state.calSavedIso===iso){ state.calSavedIso = null; render(); }
        }, 1800);
      });
    }
    else if(action==="reviewDecide"){
      var rname = btn.getAttribute("data-name"), decision = btn.getAttribute("data-decision");
      var target = state.data.targets.find(function(t){return t.name===rname;});
      addReview(rname, decision, target);
    }
    else if(action==="setArchiveFilter"){ state.archiveFilter = btn.getAttribute("data-name"); render(); }
    else if(action==="toggleArchive"){ var aid=btn.getAttribute("data-id"); state.archiveOpenId = state.archiveOpenId===aid?null:aid; render(); }
    else if(action==="downloadBackup"){ downloadBackup(); }
  });

  root.addEventListener("change", function(e){
    var input = e.target;
    if(input.matches("[data-photo-input]")){
      var id = input.getAttribute("data-photo-input");
      var file = input.files && input.files[0];
      if(!file) return;
      var items = itemsFor(state.me)[state.shift];
      var it = items.find(function(x){return x.id===id;});
      compressImage(file, 900, 0.6).then(function(url){
        if(it) updateSubmissionItem(state.me, state.shift, it, { done:true, photo:url, photoTime: nowTime() });
      });
    }
  });

  root.addEventListener("keydown", function(e){
    if(e.key!=="Enter") return;
    var t = e.target;
    if(t.id==="nameInput"){ root.querySelector('[data-action="staffLogin"]').click(); }
    else if(t.id==="pwInput"){ root.querySelector('[data-action="managerLogin"]').click(); }
    else if(t.id==="newTargetName"){ root.querySelector('[data-action="addTarget"]').click(); }
    else if(t.id==="newItemLabel"){ root.querySelector('[data-action="addChecklistItem"]').click(); }
  });

  render();
})();
</script>
